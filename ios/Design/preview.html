<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capture — interaction study</title>
<style>
:root{color-scheme:light dark;--paper:light-dark(#fff,#191919);--ink:light-dark(#202020,#efefed);--muted:light-dark(#686868,#adadad);--line:light-dark(#dededb,#414141);--wash:light-dark(#f4f4f1,#242424);--back:light-dark(#eaeae7,#101010);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:var(--ink);background:var(--back)}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;min-height:44px;padding:8px 12px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:3px}button:disabled{opacity:.35;cursor:default}a{color:inherit}header.study{max-width:1160px;margin:36px auto 24px;padding:0 24px;display:flex;align-items:baseline;gap:24px}h1{font-weight:500;font-size:22px;margin:0}.study span,.note{color:var(--muted);font-size:14px;line-height:1.6}.workspace{max-width:1160px;margin:auto;display:grid;grid-template-columns:230px minmax(320px,420px) 1fr;gap:38px;padding:0 24px 36px;align-items:start}nav{padding-top:20px}nav button{display:block;text-align:left;width:100%;color:var(--muted);border-left:2px solid transparent;padding-left:16px}nav button[aria-current=true]{color:var(--ink);border-left-color:var(--ink)}.device{height:820px;background:var(--paper);border:1px solid var(--line);border-radius:38px;overflow:hidden;min-height:760px;display:flex;flex-direction:column;box-shadow:0 12px 45px #00000009}.status{display:flex;justify-content:space-between;padding:20px 28px 8px;font-size:13px;font-weight:600}.bar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);min-height:58px;padding:0 12px}.bar strong{font-weight:500}#screen{display:flex;flex-direction:column;flex:1;min-height:0}.body{padding:24px;flex:1;min-height:0;overflow-y:auto}.kicker{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:12px}.paste{padding:6px 16px;min-height:36px;border-radius:20px;background:var(--wash);color:var(--ink)}input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0 16px;font-size:18px;border-radius:0;outline-offset:0}.block{margin:24px 0;border:1px solid var(--line);padding:18px}.block h2{font-size:22px;line-height:1.3;font-weight:500;margin:0 0 18px}.block p{font-size:16px;line-height:1.6;margin:0 0 16px}.block small{color:var(--muted)}.dest-title{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}.dest-title button{font-size:14px;padding-right:0;color:var(--ink)}.channel{display:flex;align-items:center;gap:12px;min-height:64px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}.channel .name{flex:1;line-height:1.45}.owner{color:var(--muted)}.channel small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.check{width:21px;height:21px;border:1px solid var(--line);border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px}.selected .check{background:var(--ink);color:var(--paper);border-color:var(--ink)}.footer{border-top:1px solid var(--line);padding:12px 24px 28px;background:var(--paper)}.primary{background:var(--ink);color:var(--paper);border-radius:12px;width:100%;min-height:50px;font-weight:500}.secondary{width:100%;border:1px solid var(--line);border-radius:12px}.home{width:110px;height:4px;border-radius:3px;background:var(--ink);margin:0 auto 10px}.segment{display:flex;background:var(--wash);border-radius:9px;padding:3px;margin:16px 0}.segment button{flex:1;min-height:34px;padding:6px 3px;font-size:12px;border-radius:7px}.segment button[aria-pressed=true]{background:var(--paper);box-shadow:0 1px 3px #0002}.section-label{font-size:12px;color:var(--muted);margin:22px 0 8px}.search{font-size:16px;border:0;background:var(--wash);border-radius:10px;padding:13px 14px}.intro h2{font-size:35px;line-height:1.18;font-weight:500;margin:45px 0 24px;letter-spacing:-.8px}.intro p{line-height:1.55;font-size:19px;color:var(--muted);margin-bottom:30px}.intro .minor{font-size:14px;margin-top:18px}.setting{border-bottom:1px solid var(--line);padding:18px 0;font-size:16px;display:flex;gap:15px;justify-content:space-between;align-items:center}.setting input{width:20px;height:20px}.help{font-size:13px;line-height:1.55;color:var(--muted)}.error{padding:16px;background:var(--wash);margin-top:24px;line-height:1.5;font-size:14px}.saved-mark{font-size:34px;margin:10px 0 22px;font-weight:500}.note{padding-top:24px}.note h2{color:var(--ink);font-size:16px;font-weight:500}.note p{margin:0 0 18px}.note ul{padding-left:18px}.media{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:12px}.tile{height:112px;display:grid;place-items:center;background:var(--wash);border:1px solid var(--line);font-size:13px;color:var(--muted)}.shared .body{background:var(--wash)}.share-background{padding:30px 10px 38px;color:var(--muted);line-height:1.6}.sheet{margin:0 -24px -24px;padding:20px 24px;background:var(--paper);border-radius:24px 24px 0 0;border-top:1px solid var(--line)}.grabber{width:36px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 22px}.progress{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;display:inline-block;margin-right:10px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.stage{display:flex;align-items:center;padding:22px 0}.state-message{min-height:24px;font-size:13px;color:var(--muted);margin:12px 0}.spacer{height:100px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:960px){.workspace{grid-template-columns:160px minmax(320px,420px);justify-content:center;gap:24px}.note{grid-column:2;padding-top:0}}@media(max-width:620px){header.study{display:block;margin:20px 0 10px}.study span{display:block;margin-top:8px}.workspace{display:flex;flex-direction:column;padding:0 12px 24px;gap:16px}.workspace nav{display:flex;overflow-x:auto;width:100%;padding-top:0}nav button{white-space:nowrap;width:auto;border-left:0;border-bottom:2px solid transparent;padding:8px 12px}nav button[aria-current=true]{border-bottom-color:var(--ink)}.device{width:100%;max-width:420px;align-self:center;border-radius:26px;min-height:700px}.device{height:760px}.body{min-height:0}.note{padding:0 12px;max-width:420px;align-self:center}}
</style>
</head>
<body>
<header class="study"><h1>Capture</h1><span>Interaction study · sample data · no network requests or publishing</span></header>
<main class="workspace">
<nav aria-label="Review a flow">
<button data-scene="connect">01 · Connect</button><button data-scene="default">02 · Default channel</button><button data-scene="empty">03 · Quick capture</button><button data-scene="ready">04 · Preview</button><button data-scene="channels">05 · Channels</button><button data-scene="share">06 · Share extension</button><button data-scene="saving">07 · Saving</button><button data-scene="saved">08 · Saved</button><button data-scene="uncertain">09 · Interrupted save</button><button data-scene="settings">10 · Settings</button>
</nav>
<section class="device" aria-label="Capture app prototype"><div class="status"><span>9:41</span><span aria-label="Full signal and battery">••• ▰</span></div><div id="screen"></div><div class="home"></div></section>
<aside class="note" id="notes"></aside>
</main>
<script>
const root=document.getElementById('screen'), notes=document.getElementById('notes');
const channels=[{id:1,owner:'Morgan',title:'Inbox',visibility:'Private'},{id:2,owner:'Morgan',title:'Ways of seeing',visibility:'Closed'},{id:3,owner:'Fieldwork',title:'Ordinary observations',visibility:'Closed'},{id:4,owner:'Morgan',title:'Interfaces',visibility:'Public'},{id:5,owner:'Alex',title:'A collection of gestures',visibility:'Public'}];
let scene='ready', selected=[1], implicit=true, media='auto', query='', scope='my', token='', source='https://example.com/a-way-of-seeing', automatic=false;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const row=c=>`<button class="channel ${selected.includes(c.id)?'selected':''}" data-channel="${c.id}" aria-pressed="${selected.includes(c.id)}"><span class="name"><span class="owner">${escape(c.owner)} / </span>${escape(c.title)}<small>${c.visibility}</small></span><span class="check" aria-hidden="true">${selected.includes(c.id)?'✓':''}</span></button>`;
const preview=()=>`<article class="block"><h2>A way of seeing</h2><p>A small observation can become a connection. Keep the words, the image, and the place you found them.</p>${media==='none'?'':`<div class="media"><div class="tile">Image 1</div><div class="tile">Image 2</div></div>`}<small>${media==='none'?'Text only · ': '2 attachments · '}example.com</small></article>`;
const destination=()=>`<div class="dest-title"><span>To${implicit?' · Default':''}</span><button data-go="channels">Choose channels</button></div>${selected.map(id=>row(channels.find(c=>c.id===id))).join('')}${!selected.length?'<p class="help">Choose at least one destination.</p>':''}`;
const sourceField=()=>`<div class="kicker"><span>Source</span><button class="paste" data-action="paste">Paste</button></div><input id="source" aria-label="Source link" placeholder="Link" value="${escape(source)}">`;
const segments=()=>`<div class="segment" aria-label="Media policy">${[['auto','Automatic'],['all','All media'],['none','Text only']].map(([id,label])=>`<button data-media="${id}" aria-pressed="${media===id}">${label}</button>`).join('')}</div>`;
const descriptions={connect:['Connect once','One clear invitation, followed by the account’s own authorization page. A cancelled connection leaves the shared link intact.','Personal-token entry remains an alternative.'],default:['A destination with an identity','Resolve the URL or slug before confirmation. Show the owner, channel title, and visibility together.','A visible channel is not necessarily writable; confirm add permission.'],empty:['The shortest path','Paste, then Save. With optional automatic paste, only Save remains.','Opening the app never replaces an existing draft.'],ready:['Know what will arrive','A readable preview carries the source and makes media selection visible. The destination remains adjacent to the capture.','Automatic / All media / Text only use the same engine as the CLI.'],channels:['Place it deliberately','Try choosing Ways of seeing: it replaces the implicit Inbox. Choose another channel: it adds. Choose Inbox again: it is now explicit.','Selections persist as the search changes. Removing every channel disables Save.'],share:['One composer, two contexts','The extension starts with the shared URL. The source app remains visually behind it; the capture interaction is the same.','Choose channels in the extension’s navigation flow. Persist the draft before any network write.'],saving:['Progress with a durable record','Preparation, creation, and verification are separate states. Repeated taps cannot create parallel saves.','An extension interruption preserves enough information to distinguish a known block from an unknown outcome.'],saved:['A visible arrival','Name the destination and retain a direct route to the block. Success stays until the person dismisses it.','Recent channels advance after verification, not merely after tapping Save.'],uncertain:['An honest unknown','The save may have reached Are.na. Do not turn a lost response into an automatic duplicate.','A known block ID gets “Check save status.” An unknown outcome points back to the destinations for inspection.'],settings:['Small, legible preferences','One account, one default, and explicit clipboard behavior. Capturing to another channel never changes the default.','Engine provisioning is a development concern; public distribution needs a simpler managed connection.']};
function render(){
 document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-current',b.dataset.scene===scene));
 let body='', footer='', title='Capture', back='Captures', right='Settings';
 if(scene==='connect'){back='';right='';body=`<div class="intro"><h2>A place for<br>what you find.</h2><p>Capture links and social posts into your Are.na channels, with their words and media intact.</p><button class="primary" data-go="default">Connect Are.na</button><p class="minor">You choose where each capture goes.</p><details><summary>Use a personal access token</summary><p class="help">Create a token with write access on Are.na.</p><input type="password" aria-label="Access token" placeholder="Access token"><button class="secondary" data-go="default">Connect with token</button></details></div>`;}
 else if(scene==='default'){title='Default channel';back='Back';right='';body=`<h2 style="font-size:24px;font-weight:500">Where should captures go?</h2><p class="help">Choose a place to start. You can always choose other channels for a capture.</p><input aria-label="Channel URL or slug" value="https://www.are.na/morgan/inbox"><div class="section-label">Resolved destination</div>${row(channels[0])}<p class="help">You can add to this channel.</p>`;footer='<button class="primary" data-go="empty">Use as default</button>';}
 else if(scene==='channels'){title='Channels';back='Back';right='Done';body=`<input class="search" id="query" aria-label="Find a channel" placeholder="Find a channel" value="${escape(query)}"><div class="segment">${[['my','My Are.na'],['following','My network'],['all','All']].map(([id,label])=>`<button data-scope="${id}" aria-pressed="${scope===id}">${label}</button>`).join('')}</div><div id="channel-list"></div><button data-go="default">Use a channel URL or slug</button>`;footer=`<button class="primary" data-go="ready">Done · ${selected.length} selected</button>`;}
 else if(scene==='settings'){title='Settings';back='';right='Done';body=`<div class="section-label">Account</div><div class="setting">Morgan <span class="help">Premium</span></div><div class="section-label">Default destination</div><button class="channel" data-go="default"><span class="owner">Morgan / </span>Inbox <span style="margin-left:auto">›</span></button><label class="setting">Paste automatically on open <input type="checkbox" id="automatic" ${automatic?'checked':''}></label><p class="help">Only fills an empty capture. iOS may ask permission to paste. Shared links and drafts are never replaced.</p><div class="section-label">Capture engine</div><p class="help">Prepares source text and media. Your Are.na account stays on this device.</p>`;}
 else if(scene==='saved'){body=`<div class="saved-mark">✓ Saved</div>${preview()}${destination()}<button data-action="open">Open in Are.na ↗</button><p class="state-message" role="status"></p>`;footer='<button class="primary" data-action="new">New capture</button>';}
 else if(scene==='share'){back='Close';right='';body=`<div class="share-background"><small>Source app</small><p>A way of seeing<br>A small observation can become a connection.</p></div><div class="sheet"><div class="grabber"></div><div class="kicker">Shared link</div><div style="overflow-wrap:anywhere">${escape(source)}</div>${preview()}${destination()}</div>`;footer=`<button class="primary" data-go="saving" ${!selected.length?'disabled':''}>Save</button>`;}
 else {body=sourceField()+(scene==='empty'?'<div class="spacer"></div>':preview()+segments())+destination();
 if(scene==='uncertain')body+='<div class="error"><strong>Save outcome unknown</strong><p>The save may have reached Are.na. Check your destinations before submitting this link again.</p><button data-action="open">Open destination ↗</button><p class="state-message" role="status"></p></div>';
 if(scene==='saving'){body+='<div class="stage"><span class="progress"></span>Checking your block…</div>';footer='<button class="primary" data-go="saved">Simulate confirmation</button>';}
 else if(scene==='uncertain')footer='<button class="secondary" data-action="new">Start a new capture</button>';
 else footer=`<button class="primary" data-go="saving" ${scene==='empty'||!selected.length?'disabled':''}>Save</button>`;
 }
 if(footer && ['empty','ready','share','saving','uncertain'].includes(scene) && selected.length){const first=channels.find(c=>c.id===selected[0]);footer=`<div class="help" style="padding-bottom:10px">To ${escape(first.owner)} / ${escape(first.title)}${selected.length>1?' + '+(selected.length-1):''}</div>`+footer;}
 root.innerHTML=`<div class="bar"><button data-action="back">${back}</button><strong>${title}</strong><button data-action="right">${right}</button></div><div class="body">${body}</div>${footer?`<div class="footer">${footer}</div>`:''}`;
 const [heading,a,b]=descriptions[scene]; notes.innerHTML=`<h2>${heading}</h2><p>${a}</p><p>${b}</p><p><a href="interaction.md">Full interaction specification ↗</a></p>`;
 if(scene==='channels')renderChannels();
}
function renderChannels(){const list=document.getElementById('channel-list');if(!list)return;const filtered=channels.filter(c=>!selected.includes(c.id)&&(scope!=='my'||c.owner==='Morgan')&&`${c.owner} ${c.title}`.toLowerCase().includes(query.toLowerCase()));list.innerHTML=`${selected.length?`<div class="section-label">Selected · ${selected.length} of 20</div>${selected.map(id=>row(channels.find(c=>c.id===id))).join('')}`:''}<div class="section-label">${query?'Matching channels':'Recent captures'}</div>${filtered.length?filtered.map(row).join(''):'<p class="help">No matching channels. Try another name or a URL.</p>'}`;}
function go(next){scene=next;if(next==='empty')source='';if(['ready','share','saving','saved','uncertain'].includes(next)&&!source)source='https://example.com/a-way-of-seeing';render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.scene){go(b.dataset.scene);return}if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.channel){const id=Number(b.dataset.channel);if(selected.includes(id))selected=selected.filter(x=>x!==id);else{if(implicit)selected=[];selected.push(id)}implicit=false;render();return}if(b.dataset.media){media=b.dataset.media;render();return}if(b.dataset.scope){scope=b.dataset.scope;render();return}switch(b.dataset.action){case'paste':source='https://example.com/a-way-of-seeing';go('ready');break;case'new':selected=[1];implicit=true;go('empty');break;case'back':go('ready');break;case'right':go(['channels','settings'].includes(scene)?'ready':'settings');break;case'open':document.querySelector('.state-message').textContent='In the app, this opens the saved block or destination. This study does not publish.';break;}});
document.addEventListener('input',e=>{if(e.target.id==='query'){query=e.target.value;renderChannels()}if(e.target.id==='source')source=e.target.value;if(e.target.id==='automatic')automatic=e.target.checked;});
render();
</script>
</body></html>
