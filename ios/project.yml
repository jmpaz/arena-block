name: ArenaCapture
options:
  bundleIdPrefix: org.arenacapture
  deploymentTarget:
    iOS: '17.0'
packages:
  ArenaCapture:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    TARGETED_DEVICE_FAMILY: '1,2'
    CAPTURE_BUNDLE_ID: org.arenacapture.app
    CAPTURE_APP_GROUP: group.org.arenacapture.shared
    CAPTURE_KEYCHAIN_GROUP: org.arenacapture.shared
    CAPTURE_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)$(CAPTURE_KEYCHAIN_GROUP)
    CAPTURE_CALLBACK_SCHEME: arena-capture
    ARENA_OAUTH_CLIENT_ID: ''
    CAPTURE_INGEST_BASE_URL: ''
    CAPTURE_DEFAULT_CHANNEL_MODE: fallback
    CAPTURE_INITIAL_DEFAULT_CHANNEL_ID: ''
    CAPTURE_INITIAL_DEFAULT_ACCOUNT_ID: ''
    CAPTURE_REPLACE_DEFAULT_CHANNEL_ID: ''
    CODE_SIGN_STYLE: Automatic
targets:
  Capture:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ArenaCapture
        product: CaptureUI
      - target: CaptureShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPTURE_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Capture
        UILaunchScreen: {}
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: ['$(CAPTURE_BUNDLE_ID).delivery-recovery', '$(CAPTURE_BUNDLE_ID).save.*']
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CaptureIngestBaseURL: $(CAPTURE_INGEST_BASE_URL)
        CaptureDefaultChannelMode: $(CAPTURE_DEFAULT_CHANNEL_MODE)
        CaptureInitialDefaultChannelID: $(CAPTURE_INITIAL_DEFAULT_CHANNEL_ID)
        CaptureInitialDefaultAccountID: $(CAPTURE_INITIAL_DEFAULT_ACCOUNT_ID)
        CaptureReplaceDefaultChannelID: $(CAPTURE_REPLACE_DEFAULT_CHANNEL_ID)
        CaptureAppGroup: $(CAPTURE_APP_GROUP)
        CaptureKeychainGroup: $(CAPTURE_KEYCHAIN_ACCESS_GROUP)
        CaptureCallbackScheme: $(CAPTURE_CALLBACK_SCHEME)
        ArenaOAuthClientID: $(ARENA_OAUTH_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: ['$(CAPTURE_CALLBACK_SCHEME)']
    entitlements:
      path: App/Capture.entitlements
      properties:
        com.apple.security.application-groups: ['$(CAPTURE_APP_GROUP)']
        keychain-access-groups: ['$(CAPTURE_KEYCHAIN_ACCESS_GROUP)']
  CaptureShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    dependencies:
      - package: ArenaCapture
        product: CaptureUI
      - package: ArenaCapture
        product: CaptureCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPTURE_BUNDLE_ID).share
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Capture
        CaptureIngestBaseURL: $(CAPTURE_INGEST_BASE_URL)
        CaptureDefaultChannelMode: $(CAPTURE_DEFAULT_CHANNEL_MODE)
        CaptureInitialDefaultChannelID: $(CAPTURE_INITIAL_DEFAULT_CHANNEL_ID)
        CaptureInitialDefaultAccountID: $(CAPTURE_INITIAL_DEFAULT_ACCOUNT_ID)
        CaptureReplaceDefaultChannelID: $(CAPTURE_REPLACE_DEFAULT_CHANNEL_ID)
        CaptureAppGroup: $(CAPTURE_APP_GROUP)
        CaptureKeychainGroup: $(CAPTURE_KEYCHAIN_ACCESS_GROUP)
        CaptureCallbackScheme: $(CAPTURE_CALLBACK_SCHEME)
        ArenaOAuthClientID: $(ARENA_OAUTH_CLIENT_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: RedditPreprocessor
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: ShareExtension/CaptureShare.entitlements
      properties:
        com.apple.security.application-groups: ['$(CAPTURE_APP_GROUP)']
        keychain-access-groups: ['$(CAPTURE_KEYCHAIN_ACCESS_GROUP)']
  CaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Capture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.arenacapture.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Capture

schemes:
  Capture:
    build:
      targets:
        Capture: all
    run:
      config: Debug

    test:
      config: Debug
      targets: [CaptureUITests]
